<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 16px; margin: 14px 0 8px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 280px 1fr 320px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    /* 版本协作审改 */
    .collab { margin: 0 16px 20px; }
    .collab-inner { display: grid; grid-template-columns: 300px 1fr 340px; gap: 14px; }
    .collab h2 { margin-top: 4px; }
    .collab h3 { font-size: 14px; margin: 12px 0 6px; }
    .ver-list { display: grid; gap: 8px; max-height: 430px; overflow: auto; }
    .ver-item { border: 1px solid #d9cdbc; border-radius: 8px; padding: 8px 10px; background: #fff; }
    .ver-name { font-weight: 800; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .ver-meta { color: #76695e; font-size: 12px; margin: 3px 0 7px; }
    .ver-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .ver-actions button { padding: 5px 8px; font-size: 12px; border-radius: 6px; }
    .ver-mini { display: grid; gap: 1px; width: 84px; border: 3px solid #72533c; background: #72533c; float: right; margin-left: 8px; }
    .ver-mini .mini { border-radius: 1px; }
    .compare-sel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin-bottom: 10px; }
    .compare-gridwrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cmp-grid { display: grid; gap: 1px; border: 3px solid #72533c; background: #72533c; }
    .cmp-cell { aspect-ratio: 1; border-radius: 1px; }
    .cmp-cell.same { opacity: .35; }
    .cmp-cell.diff { outline: 2px solid #8d3e37; outline-offset: -2px; }
    .cmp-cell.rfocus { outline: 2px solid #135a7d; outline-offset: -2px; }
    .legend { font-size: 12px; color: #76695e; margin: 6px 0; display: flex; gap: 14px; flex-wrap: wrap; }
    .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }
    .delta { display: grid; gap: 4px; margin-top: 10px; }
    .delta-row { display: grid; grid-template-columns: 48px 1fr 56px 72px; gap: 8px; align-items: center; font-size: 13px; }
    .delta-bar { height: 8px; background: #ece2d2; border-radius: 4px; overflow: hidden; position: relative; }
    .delta-bar i { position: absolute; left: 50%; top: 0; bottom: 0; border-radius: 0; }
    .delta-bar i.up { background: #355b38; }
    .delta-bar i.down { background: #a6322d; }
    .delta-val { text-align: right; font-variant-numeric: tabular-nums; }
    .regions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .region-row { border: 1px solid #d9cdbc; background: #fff; border-radius: 6px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
    .region-row:hover, .region-row.active { border-color: #135a7d; color: #135a7d; font-weight: 800; }
    .mgrid { display: grid; gap: 1px; border: 3px solid #72533c; background: #72533c; max-width: 420px; }
    .mcell { aspect-ratio: 1; border-radius: 1px; }
    .mcell.conflict { outline: 2px dashed #a03a2e; outline-offset: -2px; cursor: pointer; }
    .mcell.rfocus { outline: 2px solid #135a7d; outline-offset: -2px; }
    .merge-counts { font-size: 13px; margin: 8px 0; }
    .status { margin-top: 10px; font-size: 13px; min-height: 20px; }
    .status.ok { color: #355b38; font-weight: 800; }
    .status.err { color: #a03a2e; font-weight: 800; }
    .muted { color: #76695e; font-size: 13px; }
    .merge-list { display: grid; gap: 8px; max-height: 180px; overflow: auto; }
    @media (max-width: 1000px) { header { display: block; } .app, .collab-inner { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台</h1><div>绘制经纬网格纹样，统计色线用量、保存方案，并支持多版本对比与合并。</div></div>
    <div class="toolbar" style="grid-template-columns: repeat(3, auto);">
      <button id="saveBtn">保存方案</button>
      <button id="exportBtn" class="secondary">导出工作区</button>
      <button id="importBtn" class="secondary">导入还原</button>
    </div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn">新建网格</button>
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel"><div class="grid" id="grid"></div></section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p>点击填色，按住拖动可连续填色。</p>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>

  <section class="collab panel">
    <h2>多版本协作审改</h2>
    <div class="collab-inner">
      <div>
        <h3>版本库</h3>
        <label>版本名称</label>
        <div class="toolbar" style="grid-template-columns: 1fr auto;">
          <input id="verName" type="text" placeholder="如：师傅改稿·第一轮">
          <button id="saveVerBtn">存为版本</button>
        </div>
        <div class="ver-list" id="verList"></div>
      </div>

      <div>
        <h3>版本对比（逐格差异 / 每色数量变化 / 受影响区域）</h3>
        <div class="compare-sel">
          <select id="verA"></select>
          <b>对</b>
          <select id="verB"></select>
        </div>
        <div id="compareBody"></div>
      </div>

      <div>
        <h3>冲突审改与合并</h3>
        <p class="muted">虚线格为两版不一致的冲突格，点击该格在 A/B 之间逐格取舍。</p>
        <div class="toolbar" style="margin-bottom: 6px;">
          <button id="allABtn" class="secondary">全部取A</button>
          <button id="allBBtn" class="secondary">全部取B</button>
        </div>
        <div id="mergeBody"></div>
        <label>合并结果名称</label>
        <input id="mergeName" type="text" placeholder="如：A+B 合并稿">
        <div class="toolbar" style="margin-top: 8px;">
          <button id="completeMergeBtn">完成合并</button>
          <button id="swapMergeBtn" class="secondary">交换A/B</button>
        </div>
        <h3>合并记录</h3>
        <div class="merge-list" id="mergeList"></div>
      </div>
    </div>
  </section>

  <input id="importFile" type="file" accept="application/json,.json" hidden>

  <script>
    const colors = ["#f7e7c4","#a6322d","#1f5f78","#d6a437","#355b7b","#713d7b","#1e1b18","#e98c52"];
    const COLOR_LABELS = ["米白","朱红","靛蓝","藤黄","松绿","茄紫","玄黑","赭橙"];
    const KEY_CANVAS = "zfl31Pattern";
    const KEY_VERSIONS = "zfl31PatternVersions";
    const KEY_MERGES = "zfl31PatternMerges";
    const KEY_SESSION = "zfl31PatternMergeSession";

    const grid = document.querySelector("#grid");
    const palette = document.querySelector("#palette");
    const statsEl = document.querySelector("#stats");
    const preview = document.querySelector("#preview");
    const riskEl = document.querySelector("#risk");
    const verList = document.querySelector("#verList");
    const verASel = document.querySelector("#verA");
    const verBSel = document.querySelector("#verB");
    const compareBody = document.querySelector("#compareBody");
    const mergeBody = document.querySelector("#mergeBody");
    const mergeList = document.querySelector("#mergeList");

    let cols = 18, rows = 14, active = 1, block = "dot", dragging = false;
    let cells = [];
    let undo = [], redo = [];
    let versions = [];
    let merges = [];
    let session = null; // { a, b, resolutions: { "<index>": "A"|"B" } }
    let activeRegion = null; // 当前高亮的受影响区域

    /* ---------- 存储工具 ---------- */
    function loadJSON(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
      catch (e) { return fallback; }
    }
    function saveJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); }
      catch (e) { setStatus("浏览器存储已满，未能写入本地。", true); }
    }
    function nowId() { return Date.now().toString(36) + Math.floor(Math.random() * 4096).toString(36); }
    function fmtTime(ts) {
      const d = new Date(ts);
      const p = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
    function cleanCells(value, count) {
      if (!Array.isArray(value)) return null;
      const out = value.map(v => { const n = Number(v); return (Number.isInteger(n) && n >= 0 && n < colors.length) ? n : 0; });
      while (out.length < count) out.push(0);
      return out.slice(0, count);
    }
    function cleanGridData(g) {
      if (!g || !Number.isInteger(g.cols) || !Number.isInteger(g.rows)) return null;
      const c = Math.min(36, Math.max(6, g.cols)), r = Math.min(32, Math.max(6, g.rows));
      const cs = cleanCells(g.cells, c * r);
      if (!cs) return null;
      return { cols: c, rows: r, cells: cs };
    }
    function cleanVersion(v) {
      const g = cleanGridData(v);
      if (!g || !v || !v.id) return null;
      return { id: String(v.id), name: String(v.name || "未命名版本"), createdAt: Number(v.createdAt) || Date.now(), ...g };
    }
    function defaultResolutions(diffIdx) {
      const res = {};
      diffIdx.forEach(i => { res[i] = "A"; });
      return res;
    }

    /* ---------- 初始化 ---------- */
    function init() {
      const saved = loadJSON(KEY_CANVAS, null);
      const g = cleanGridData(saved);
      if (g) { cols = g.cols; rows = g.rows; cells = g.cells; }
      else {
        cols = Number(document.querySelector("#cols").value);
        rows = Number(document.querySelector("#rows").value);
        cells = Array(cols * rows).fill(0);
      }
      const savedUndo = loadJSON(KEY_CANVAS + "History", null);
      if (savedUndo && Array.isArray(savedUndo.undo) && Array.isArray(savedUndo.redo)) {
        undo = savedUndo.undo.map(cleanGridData).filter(Boolean);
        redo = savedUndo.redo.map(cleanGridData).filter(Boolean);
      }
      versions = (loadJSON(KEY_VERSIONS, []) || []).map(cleanVersion).filter(Boolean);
      merges = (loadJSON(KEY_MERGES, []) || []).map(cleanMerge).filter(Boolean);
      session = loadJSON(KEY_SESSION, null);
      if (session && (!getVersion(session.a) || !getVersion(session.b))) session = null;

      document.querySelector("#cols").value = cols;
      document.querySelector("#rows").value = rows;
      render();
      renderCollab();
    }
    function persistCanvas() { saveJSON(KEY_CANVAS, { cols, rows, cells }); }
    function persistHistory() { saveJSON(KEY_CANVAS + "History", { undo, redo }); }

    /* ---------- 绘制 ---------- */
    function render() {
      palette.innerHTML = colors.map((c, i) => `<button class="swatch ${i === active ? "active" : ""}" data-color="${i}" style="background:${c}"></button>`).join("");
      palette.querySelectorAll("[data-color]").forEach(el => el.onclick = () => { active = Number(el.dataset.color); render(); });
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.innerHTML = cells.map((v, i) => `<div class="cell" data-i="${i}" style="background:${colors[v]}"></div>`).join("");
      grid.querySelectorAll(".cell").forEach(el => {
        el.onpointerdown = () => { dragging = true; paint(Number(el.dataset.i)); };
        el.onpointerenter = () => { if (dragging) paint(Number(el.dataset.i)); };
      });
      window.onpointerup = () => dragging = false;
      renderStats();
    }
    function snapshot() {
      undo.push({ cols, rows, cells: [...cells] });
      redo = [];
      if (undo.length > 50) undo.shift();
      persistHistory();
    }
    function paint(i) {
      snapshot();
      pattern(i).forEach(t => { if (t >= 0 && t < cells.length) cells[t] = active; });
      persistCanvas();
      render();
    }
    function pattern(i) {
      const x = i % cols, y = Math.floor(i / cols);
      if (block === "cross") return [i, idx(x - 1, y), idx(x + 1, y), idx(x, y - 1), idx(x, y + 1)].filter(v => v !== null);
      if (block === "diamond") return [idx(x, y - 1), idx(x - 1, y), i, idx(x + 1, y), idx(x, y + 1)].filter(v => v !== null);
      return [i];
    }
    function idx(x, y) { return x < 0 || x >= cols || y < 0 || y >= rows ? null : y * cols + x; }

    /* ---------- 统计与风险 ---------- */
    function countOf(arr, colsCount, rowsCount) {
      return colors.map((_, i) => arr.filter(v => v === i).length);
    }
    function renderStats() {
      const counts = countOf(cells, cols, rows);
      statsEl.innerHTML = counts.map((n, i) =>
        `<div class="stat"><span><span style="display:inline-block;width:14px;height:14px;background:${colors[i]}"></span> ${esc(COLOR_LABELS[i])}·色线${i}</span><b>${n}</b></div>`
      ).join("");
      preview.innerHTML = Array.from({ length: 36 }, (_, i) => {
        const ci = (i % 6) + Math.floor(i / 6) * cols;
        return `<div class="mini" style="background:${colors[cells[ci] ?? 0]}"></div>`;
      }).join("");
      const riskRows = [];
      for (let y = 0; y < rows; y++) {
        let switches = 0;
        for (let x = 1; x < cols; x++) if (cells[y * cols + x] !== cells[y * cols + x - 1]) switches++;
        if (switches > cols * .62) riskRows.push(y + 1);
      }
      riskEl.innerHTML = riskRows.length
        ? `<p class="warning">第${riskRows.join("、")}行换色过密，可能断线。</p>`
        : `<p>暂无明显断线风险。</p>`;
    }

    /* ---------- 版本库 ---------- */
    function getVersion(id) { return versions.find(v => v.id === id) || null; }
    function saveVersion() {
      const input = document.querySelector("#verName");
      const name = input.value.trim() || `版本 ${versions.length + 1}（${fmtTime(Date.now()).slice(5)}）`;
      versions.push({ id: nowId(), name, createdAt: Date.now(), cols, rows, cells: [...cells] });
      versions.sort((a, b) => b.createdAt - a.createdAt);
      saveJSON(KEY_VERSIONS, versions);
      input.value = "";
      setStatus(`已存为命名版本「${name}」。`, false);
      renderCollab();
    }
    function checkoutVersion(id) {
      const v = getVersion(id);
      if (!v) return;
      undo.push({ cols, rows, cells: [...cells] }); redo = []; persistHistory();
      cols = v.cols; rows = v.rows; cells = [...v.cells];
      document.querySelector("#cols").value = cols;
      document.querySelector("#rows").value = rows;
      persistCanvas();
      setStatus(`已从版本「${v.name}」继续绘制，可用撤销回到之前画布。`, false);
      render();
    }
    function deleteVersion(id) {
      const v = getVersion(id);
      if (!v) return;
      if (!confirm(`确定删除版本「${v.name}」？此操作不影响已保存的合并记录。`)) return;
      versions = versions.filter(x => x.id !== id);
      saveJSON(KEY_VERSIONS, versions);
      if (session && (session.a === id || session.b === id)) { session = null; saveJSON(KEY_SESSION, null); }
      setStatus(`已删除版本「${v.name}」。`, false);
      renderCollab();
    }

    /* ---------- 对比计算 ---------- */
    function computeDiff(a, b) {
      const n = Math.min(a.cells.length, b.cells.length);
      const diffIdx = [];
      for (let i = 0; i < n; i++) if (a.cells[i] !== b.cells[i]) diffIdx.push(i);
      const regions = affectedRegions(diffIdx, a.cols, a.rows);
      const ca = countOf(a.cells, a.cols, a.rows), cb = countOf(b.cells, b.cols, b.rows);
      const delta = colors.map((c, i) => ({ color: c, label: COLOR_LABELS[i], a: ca[i], b: cb[i], d: cb[i] - ca[i] }));
      return { diffIdx, regions, delta };
    }
    function affectedRegions(idxCells, c, r) {
      const set = new Set(idxCells);
      const seen = new Set();
      const out = [];
      for (const start of idxCells) {
        if (seen.has(start)) continue;
        const stack = [start], comp = [];
        seen.add(start);
        while (stack.length) {
          const i = stack.pop();
          comp.push(i);
          const x = i % c, y = Math.floor(i / c);
          for (const [nx, ny] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) {
            if (nx < 0 || nx >= c || ny < 0 || ny >= r) continue;
            const ni = ny * c + nx;
            if (set.has(ni) && !seen.has(ni)) { seen.add(ni); stack.push(ni); }
          }
        }
        const xs = comp.map(i => i % c), ys = comp.map(i => Math.floor(i / c));
        out.push({
          cells: comp.sort((p, q) => p - q),
          size: comp.length,
          box: `${Math.min(...xs) + 1},${Math.min(...ys) + 1}–${Math.max(...xs) + 1},${Math.max(...ys) + 1}`
        });
      }
      return out.sort((p, q) => q.size - p.size);
    }

    /* ---------- 版本协作区渲染 ---------- */
    function renderCollab() {
      renderVersionList();
      renderVersionSelects();
      renderCompare();
      renderMerge();
      renderMergeList();
    }
    function renderVersionList() {
      if (!versions.length) {
        verList.innerHTML = `<p class="muted">尚无命名版本。改完一稿后点“存为版本”。</p>`;
        return;
      }
      verList.innerHTML = versions.map(v => `
        <div class="ver-item">
          ${miniGridHTML(v)}
          <div class="ver-name"><span title="${esc(v.name)}">${esc(v.name)}</span></div>
          <div class="ver-meta">${fmtTime(v.createdAt)} · ${v.cols}×${v.rows} · ${countOf(v.cells, v.cols, v.rows).reduce((s, n) => s + (n ? 1 : 0), 0)} 色</div>
          <div class="ver-actions">
            <button data-act="checkout" data-id="${v.id}">从此版绘制</button>
            <button class="secondary" data-act="pickA" data-id="${v.id}">选作A</button>
            <button class="secondary" data-act="pickB" data-id="${v.id}">选作B</button>
            <button class="secondary" data-act="del" data-id="${v.id}">删除</button>
          </div>
        </div>`).join("");
    }
    function miniGridHTML(g) {
      const widthPx = 84;
      const cellW = Math.max(2, Math.floor(widthPx / g.cols));
      const style = `width:${cellW * g.cols}px`;
      return `<div class="ver-mini" style="${style};grid-template-columns:repeat(${g.cols},1fr)">${
        g.cells.map(v => `<div class="mini" style="background:${colors[v]}"></div>`).join("")
      }</div>`;
    }
    function renderVersionSelects() {
      const opts = versions.map(v => `<option value="${v.id}">${esc(v.name)}</option>`).join("");
      const prevA = verASel.value, prevB = verBSel.value;
      verASel.innerHTML = opts; verBSel.innerHTML = opts;
      if (versions.length) {
        // 刷新后优先恢复未完成的合并会话（含逐格冲突选择）
        if (session && getVersion(session.a) && getVersion(session.b)) {
          verASel.value = session.a;
          verBSel.value = session.b;
        } else {
          verASel.value = getVersion(prevA) ? prevA : versions[Math.min(1, versions.length - 1)].id;
          verBSel.value = getVersion(prevB) ? prevB : versions[0].id;
        }
      }
      ensureSession();
    }
    function ensureSession() {
      const a = verASel.value, b = verBSel.value;
      const va = getVersion(a), vb = getVersion(b);
      if (!va || !vb) { session = null; saveJSON(KEY_SESSION, null); return; }
      if (!session || session.a !== a || session.b !== b) {
        const diff = va.cols === vb.cols && va.rows === vb.rows ? computeDiff(va, vb).diffIdx : [];
        session = { a, b, resolutions: defaultResolutions(diff) };
        saveJSON(KEY_SESSION, session);
      }
    }

    function renderCompare() {
      const va = getVersion(verASel.value), vb = getVersion(verBSel.value);
      if (!va || !vb) {
        compareBody.innerHTML = `<p class="muted">先在“版本库”中至少保存两个版本，即可查看差异。</p>`;
        return;
      }
      if (va.cols !== vb.cols || va.rows !== vb.rows) {
        compareBody.innerHTML = `<p class="warning">两版网格尺寸不同（A：${va.cols}×${va.rows}，B：${vb.cols}×${vb.rows}），无法逐格对比与合并。请用相同尺寸的版本比较。</p>`;
        return;
      }
      const { diffIdx, regions, delta } = computeDiff(va, vb);
      const focusSet = activeRegion != null ? new Set(regions[activeRegion]?.cells || []) : null;
      const gridHTML = g => {
        const cls = i => {
          const c = ["cmp-cell"];
          if (diffIdx.includes(i)) c.push("diff");
          if (focusSet && focusSet.has(i)) c.push("rfocus");
          if (!diffIdx.includes(i)) c.push("same");
          return c.join(" ");
        };
        return `<div class="cmp-grid" style="grid-template-columns:repeat(${g.cols},1fr)">${
          g.cells.map((v, i) => `<div class="${cls(i)}" style="background:${colors[v]}" title="第${Math.floor(i / g.cols) + 1}行 第${i % g.cols + 1}列"></div>`).join("")
        }</div>`;
      };
      const changedPct = Math.round(diffIdx.length / va.cells.length * 1000) / 10;
      const maxAbs = Math.max(1, ...delta.map(d => Math.abs(d.d)));
      compareBody.innerHTML = `
        <p class="muted">A：<b>${esc(va.name)}</b> 对 B：<b>${esc(vb.name)}</b> — ${diffIdx.length} 格不同（占 ${changedPct}%），连成 ${regions.length} 个受影响区域。</p>
        <div class="legend"><span><i style="background:#8d3e37"></i>差异格</span><span><i style="background:#135a7d"></i>选中区域</span><span><i style="background:#c9bca8"></i>相同格（淡化）</span></div>
        <div class="compare-gridwrap"><div><div class="muted">版本A</div>${gridHTML(va)}</div><div><div class="muted">版本B</div>${gridHTML(vb)}</div></div>
        <h3 style="margin-top:12px">每色数量变化（B − A）</h3>
        <div class="delta">${delta.map(d => {
          const w = Math.abs(d.d) / maxAbs * 50;
          const sign = d.d > 0 ? "+" : "";
          return `<div class="delta-row">
            <span><i style="display:inline-block;width:12px;height:12px;background:${d.color};border-radius:2px"></i> ${esc(d.label)}</span>
            <span class="delta-bar"><i class="${d.d > 0 ? "up" : d.d < 0 ? "down" : ""}" style="width:${w}%;${d.d < 0 ? "right:50%" : "left:50%"}"></i></span>
            <span class="muted">${d.a}→${d.b}</span>
            <b class="delta-val" style="color:${d.d > 0 ? "#355b38" : d.d < 0 ? "#a6322d" : "#76695e"}">${sign}${d.d}</b>
          </div>`;
        }).join("")}</div>
        <h3 style="margin-top:12px">受影响区域（点击高亮）</h3>
        <div class="regions">${regions.length ? regions.map((rg, ri) =>
          `<span class="region-row ${activeRegion === ri ? "active" : ""}" data-region="${ri}">区域${ri + 1} · ${rg.size}格 · ${rg.box}</span>`
        ).join("") : `<span class="muted">两版完全一致，没有受影响区域。</span>`}</div>`;
    }

    /* ---------- 合并 ---------- */
    function renderMerge() {
      ensureSession();
      const va = session && getVersion(session.a), vb = session && getVersion(session.b);
      document.querySelector("#allABtn").disabled = !va || !vb;
      document.querySelector("#allBBtn").disabled = !va || !vb;
      document.querySelector("#completeMergeBtn").disabled = !va || !vb;
      document.querySelector("#swapMergeBtn").disabled = !va || !vb;
      if (!va || !vb) { mergeBody.innerHTML = `<p class="muted">选择两个版本后逐格处理冲突。</p>`; return; }
      if (va.cols !== vb.cols || va.rows !== vb.rows) {
        mergeBody.innerHTML = `<p class="warning">尺寸不同的版本不能合并。</p>`;
        document.querySelector("#allABtn").disabled = true;
        document.querySelector("#allBBtn").disabled = true;
        document.querySelector("#completeMergeBtn").disabled = true;
        return;
      }
      const { diffIdx, regions } = computeDiff(va, vb);
      const focusSet = activeRegion != null ? new Set(regions[activeRegion]?.cells || []) : null;
      const res = session.resolutions;
      const conflictSet = new Set(diffIdx);
      const pickedA = diffIdx.filter(i => res[i] !== "B").length;
      const pickedB = diffIdx.length - pickedA;
      const cellsHTML = va.cells.map((av, i) => {
        const bv = vb.cells[i];
        const isConflict = conflictSet.has(i);
        const choice = res[i] === "B" ? bv : av;
        const cls = ["mcell"];
        if (isConflict) cls.push("conflict");
        else cls.push("same");
        if (focusSet && focusSet.has(i)) cls.push("rfocus");
        return `<div class="${cls.join(" ")}" data-i="${i}" style="background:${colors[choice]}" title="${
          isConflict ? `冲突格：A=${COLOR_LABELS[av]} / B=${COLOR_LABELS[bv]}，当前取${res[i] === "B" ? "B" : "A"}（点击切换）` : ""
        }"></div>`;
      }).join("");
      mergeBody.innerHTML = `
        <div class="mgrid" style="grid-template-columns:repeat(${va.cols},1fr)">${cellsHTML}</div>
        <div class="merge-counts">冲突 <b>${diffIdx.length}</b> 格 · 取A <b>${pickedA}</b> · 取B <b>${pickedB}</b> · 涉及 ${regions.length} 个区域</div>`;
    }
    function flipConflict(i) {
      if (!session) return;
      const va = getVersion(session.a), vb = getVersion(session.b);
      if (!va || !vb || va.cells[i] === vb.cells[i]) return;
      session.resolutions[i] = session.resolutions[i] === "B" ? "A" : "B";
      saveJSON(KEY_SESSION, session);
      renderMerge();
    }
    function chooseAll(side) {
      if (!session) return;
      const va = getVersion(session.a), vb = getVersion(session.b);
      if (!va || !vb) return;
      computeDiff(va, vb).diffIdx.forEach(i => { session.resolutions[i] = side; });
      saveJSON(KEY_SESSION, session);
      renderMerge();
    }
    function swapAB() {
      if (!session) return;
      const old = session;
      verASel.value = old.b;
      verBSel.value = old.a;
      ensureSession();
      activeRegion = null;
      renderCompare();
      renderMerge();
    }
    function buildMergedCells(va, vb) {
      const res = session.resolutions;
      return va.cells.map((av, i) => (vb.cells[i] !== av && res[i] === "B") ? vb.cells[i] : av);
    }
    function cleanMerge(m) {
      if (!m || !m.id || !m.name || !m.a || !m.b) return null;
      const g = cleanGridData(m);
      if (!g) return null;
      return {
        id: String(m.id), name: String(m.name), createdAt: Number(m.createdAt) || Date.now(),
        a: String(m.a), b: String(m.b),
        aName: String(m.aName || "版本A"), bName: String(m.bName || "版本B"),
        conflictCount: Number(m.conflictCount) || 0,
        pickedA: Number(m.pickedA) || 0, pickedB: Number(m.pickedB) || 0,
        ...g
      };
    }
    function completeMerge() {
      ensureSession();
      if (!session) return;
      const va = getVersion(session.a), vb = getVersion(session.b);
      if (!va || !vb) { setStatus("请先选择两个版本。", true); return; }
      if (va.cols !== vb.cols || va.rows !== vb.rows) { setStatus("两版尺寸不同，不能合并。", true); return; }
      const diff = computeDiff(va, vb).diffIdx;
      const mergedCells = buildMergedCells(va, vb);
      const name = document.querySelector("#mergeName").value.trim() || `合并：${va.name} + ${vb.name}`;
      const pickedB = diff.filter(i => session.resolutions[i] === "B").length;
      const record = {
        id: nowId(), name, createdAt: Date.now(),
        a: va.id, b: vb.id, aName: va.name, bName: vb.name,
        conflictCount: diff.length, pickedA: diff.length - pickedB, pickedB,
        cols: va.cols, rows: va.rows, cells: mergedCells
      };
      merges.unshift(record);
      saveJSON(KEY_MERGES, merges);
      // 合并结果载入画布：统计、断线风险、撤销记录同步更新
      undo.push({ cols, rows, cells: [...cells] }); redo = []; persistHistory();
      cols = va.cols; rows = va.rows; cells = mergedCells;
      document.querySelector("#cols").value = cols;
      document.querySelector("#rows").value = rows;
      persistCanvas();
      session = null;
      saveJSON(KEY_SESSION, null);
      document.querySelector("#mergeName").value = "";
      setStatus(`合并「${name}」已完成：${diff.length} 格冲突（取A ${diff.length - pickedB}、取B ${pickedB}），结果已载入画布，统计与断线风险已刷新。可继续绘制或存为新版本。`, false);
      render();
      renderCollab();
    }
    function renderMergeList() {
      if (!merges.length) { mergeList.innerHTML = `<p class="muted">尚无合并记录。</p>`; return; }
      mergeList.innerHTML = merges.map(m => `
        <div class="ver-item">
          <div class="ver-name"><span title="${esc(m.name)}">${esc(m.name)}</span></div>
          <div class="ver-meta">${fmtTime(m.createdAt)} · ${esc(m.aName)} ⨯ ${esc(m.bName)}<br>冲突${m.conflictCount}格（A${m.pickedA}/B${m.pickedB}）· ${m.cols}×${m.rows}</div>
          <div class="ver-actions">
            <button data-act="loadMerge" data-id="${m.id}">载入继续绘制</button>
            <button class="secondary" data-act="mergeToVersion" data-id="${m.id}">存为版本</button>
            <button class="secondary" data-act="delMerge" data-id="${m.id}">删除</button>
          </div>
        </div>`).join("");
    }
    function loadMerge(id) {
      const m = merges.find(x => x.id === id);
      if (!m) return;
      undo.push({ cols, rows, cells: [...cells] }); redo = []; persistHistory();
      cols = m.cols; rows = m.rows; cells = [...m.cells];
      document.querySelector("#cols").value = cols;
      document.querySelector("#rows").value = rows;
      persistCanvas();
      setStatus(`已载入合并结果「${m.name}」继续绘制。`, false);
      render();
    }
    function mergeToVersion(id) {
      const m = merges.find(x => x.id === id);
      if (!m) return;
      versions.push({ id: nowId(), name: m.name, createdAt: Date.now(), cols: m.cols, rows: m.rows, cells: [...m.cells] });
      versions.sort((a, b) => b.createdAt - a.createdAt);
      saveJSON(KEY_VERSIONS, versions);
      setStatus(`合并结果「${m.name}」已存入版本库。`, false);
      renderCollab();
    }
    function deleteMerge(id) {
      const m = merges.find(x => x.id === id);
      if (!m) return;
      if (!confirm(`确定删除合并记录「${m.name}」？`)) return;
      merges = merges.filter(x => x.id !== id);
      saveJSON(KEY_MERGES, merges);
      renderMergeList();
    }

    /* ---------- 状态提示 ---------- */
    let statusTimer = null;
    function setStatus(msg, isError) {
      let el = document.querySelector("#collabStatus");
      if (!el) {
        el = document.createElement("div");
        el.id = "collabStatus";
        el.className = "status";
        document.querySelector(".collab-inner").after(el);
      }
      el.textContent = msg;
      el.className = "status " + (isError ? "err" : "ok");
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { el.textContent = ""; el.className = "status"; }, 6000);
    }

    /* ---------- 导出 / 导入 ---------- */
    function exportWorkspace() {
      const data = {
        format: "zfl31-brocade-workspace",
        version: 2,
        exportedAt: new Date().toISOString(),
        canvas: { cols, rows, cells },
        usage: colors.map((color, i) => ({ color, count: cells.filter(v => v === i).length })),
        versions,
        merges
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `brocade-workspace-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus("工作区已导出（含当前画布、全部版本与合并记录），可用“导入还原”完整恢复。", false);
    }
    function importWorkspace(file) {
      const reader = new FileReader();
      reader.onload = () => {
        let data;
        try { data = JSON.parse(reader.result); }
        catch (e) { setStatus("文件不是有效的 JSON，导入失败。", true); return; }
        // 兼容旧版单图案导出
        if (!data.format && cleanGridData(data)) {
          if (!confirm("这是旧版单图案文件，将只还原画布（不影响现有版本库）。继续？")) return;
          const g = cleanGridData(data);
          undo.push({ cols, rows, cells: [...cells] }); redo = []; persistHistory();
          cols = g.cols; rows = g.rows; cells = g.cells;
          document.querySelector("#cols").value = cols;
          document.querySelector("#rows").value = rows;
          persistCanvas();
          render();
          setStatus("已从旧版文件还原画布。", false);
          return;
        }
        const g = cleanGridData(data.canvas);
        const newVersions = (Array.isArray(data.versions) ? data.versions : []).map(cleanVersion).filter(Boolean);
        const newMerges = (Array.isArray(data.merges) ? data.merges : []).map(cleanMerge).filter(Boolean);
        if (!g) { setStatus("文件中没有可还原的画布数据。", true); return; }
        undo = []; redo = [];
        cols = g.cols; rows = g.rows; cells = g.cells;
        document.querySelector("#cols").value = cols;
        document.querySelector("#rows").value = rows;
        versions = newVersions;
        merges = newMerges;
        session = null;
        persistCanvas(); persistHistory();
        saveJSON(KEY_VERSIONS, versions);
        saveJSON(KEY_MERGES, merges);
        saveJSON(KEY_SESSION, null);
        activeRegion = null;
        render();
        renderCollab();
        setStatus(`工作区已还原：${versions.length} 个版本、${merges.length} 条合并记录。`, false);
      };
      reader.onerror = () => setStatus("读取文件失败。", true);
      reader.readAsText(file);
    }

    /* ---------- 事件绑定 ---------- */
    document.querySelectorAll("[data-block]").forEach(btn => btn.onclick = () => block = btn.dataset.block);
    document.querySelector("#newBtn").onclick = () => {
      undo = []; redo = [];
      cols = Number(document.querySelector("#cols").value);
      rows = Number(document.querySelector("#rows").value);
      cells = Array(cols * rows).fill(0);
      persistCanvas(); persistHistory();
      render();
    };
    document.querySelector("#undoBtn").onclick = () => {
      if (!undo.length) return;
      redo.push({ cols, rows, cells: [...cells] });
      const s = undo.pop();
      cols = s.cols; rows = s.rows; cells = s.cells;
      document.querySelector("#cols").value = cols;
      document.querySelector("#rows").value = rows;
      persistCanvas(); persistHistory();
      render();
    };
    document.querySelector("#redoBtn").onclick = () => {
      if (!redo.length) return;
      undo.push({ cols, rows, cells: [...cells] });
      const s = redo.pop();
      cols = s.cols; rows = s.rows; cells = s.cells;
      document.querySelector("#cols").value = cols;
      document.querySelector("#rows").value = rows;
      persistCanvas(); persistHistory();
      render();
    };
    document.querySelector("#saveBtn").onclick = () => { persistCanvas(); persistHistory(); setStatus("当前方案已保存到本地。", false); };
    document.querySelector("#exportBtn").onclick = exportWorkspace;
    document.querySelector("#importBtn").onclick = () => document.querySelector("#importFile").click();
    document.querySelector("#importFile").onchange = e => {
      const f = e.target.files[0];
      if (f) importWorkspace(f);
      e.target.value = "";
    };
    document.querySelector("#saveVerBtn").onclick = saveVersion;
    verASel.onchange = () => { ensureSession(); activeRegion = null; renderCompare(); renderMerge(); };
    verBSel.onchange = () => { ensureSession(); activeRegion = null; renderCompare(); renderMerge(); };
    document.querySelector("#allABtn").onclick = () => chooseAll("A");
    document.querySelector("#allBBtn").onclick = () => chooseAll("B");
    document.querySelector("#swapMergeBtn").onclick = swapAB;
    document.querySelector("#completeMergeBtn").onclick = completeMerge;
    // 版本库 / 合并记录按钮（事件委托）
    verList.onclick = e => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const id = btn.dataset.id;
      if (btn.dataset.act === "checkout") checkoutVersion(id);
      if (btn.dataset.act === "pickA") { verASel.value = id; verASel.onchange(); }
      if (btn.dataset.act === "pickB") { verBSel.value = id; verBSel.onchange(); }
      if (btn.dataset.act === "del") deleteVersion(id);
    };
    mergeList.onclick = e => {
      const btn = e.target.closest("button[data-act]");
      if (!btn) return;
      const id = btn.dataset.id;
      if (btn.dataset.act === "loadMerge") loadMerge(id);
      if (btn.dataset.act === "mergeToVersion") mergeToVersion(id);
      if (btn.dataset.act === "delMerge") deleteMerge(id);
    };
    // 冲突格点击
    mergeBody.onclick = e => {
      const cell = e.target.closest(".mcell.conflict");
      if (cell) flipConflict(Number(cell.dataset.i));
    };
    // 受影响区域高亮（对比与合并共用）
    compareBody.onclick = e => {
      const row = e.target.closest(".region-row");
      if (!row) return;
      const ri = Number(row.dataset.region);
      activeRegion = activeRegion === ri ? null : ri;
      renderCompare();
      renderMerge();
    };

    init();
  </script>
</body>
</html>
